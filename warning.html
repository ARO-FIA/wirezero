<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WireZero — Lookalike Domain Warning</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #111827; background: #fff; }
    .box { max-width: 440px; padding: 1.75rem; border: 1px solid #e5e7eb; border-radius: 8px; }
    .brand { font-size: 0.75rem; font-weight: 700; color: #007ba7; }
    h1 { font-size: 1.2rem; margin: 0.6rem 0; }
    p { color: #6b7280; font-size: 0.92rem; line-height: 1.55; }
    .domain { font-family: ui-monospace, Menlo, monospace; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.6rem 0.8rem; margin: 1rem 0 1.25rem; word-break: break-all; }
    .actions { display: flex; gap: 0.6rem; }
    button { padding: 0.6rem 1rem; font-size: 0.9rem; border-radius: 6px; border: 1px solid #e5e7eb; background: #fff; color: #6b7280; cursor: pointer; }
    .btn-back { background: #007ba7; border-color: #007ba7; color: #fff; }
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">WireZero Protection</div>
    <h1>Possible lookalike domain detected</h1>
    <p>
      This website uses internationalized Punycode characters that can impersonate trusted brands. Verify the address carefully before entering passwords.
    </p>
    <div class="domain" id="host-display"></div>
    <div class="actions">
      <button class="btn-back" id="go-back">Go back safely</button>
      <button id="proceed">Trust this site anyway</button>
    </div>
  </main>
  <script src="warning.js"></script>
</body>
</html>
